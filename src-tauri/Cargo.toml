[package]
name = "code-merger-desktop"
version = "0.1.0"
description = "One chat for all your coding agents"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
